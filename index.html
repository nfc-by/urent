<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#121318">
<link rel="manifest" href="data:application/manifest+json,{&quot;name&quot;:&quot;LostBot&quot;,&quot;short_name&quot;:&quot;LostBot&quot;,&quot;display&quot;:&quot;standalone&quot;,&quot;background_color&quot;:&quot;#121318&quot;,&quot;theme_color&quot;:&quot;#121318&quot;}">

<title>LostBot v1.0.0</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    :root {
        --bg-color: #121318;
        --card-bg: #1c1d24;
        --primary-color: #8b7ef8;
        --text-main: #ffffff;
        --text-muted: #8e8e93;
        --nav-bg: #121318;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-color); color: var(--text-main); height: 100vh; width: 100vw; overflow: hidden; display: flex; flex-direction: column; user-select: none; }
    
    .screen { display: none; flex-direction: column; height: 100%; width: 100%; position: fixed; top: 0; left: 0; background: var(--bg-color); z-index: 1; }
    .screen.active { display: flex; }
    
    /* Start Screen */
    #start-screen { justify-content: center; align-items: center; padding: 20px; z-index: 5; }
    .logo-container { width: 120px; height: 120px; background: rgba(139, 126, 248, 0.1); border: 2px solid rgba(139, 126, 248, 0.3); border-radius: 30px; display: flex; justify-content: center; align-items: center; margin-bottom: 20px; }
    .logo-container i { font-size: 50px; color: var(--primary-color); }
    .app-title { font-size: 32px; font-weight: bold; margin-bottom: 5px; }
    .app-version { font-size: 14px; color: var(--text-muted); margin-bottom: 60px; }
    .btn { width: 100%; max-width: 350px; padding: 18px; border-radius: 16px; border: none; font-size: 16px; font-weight: 600; cursor: pointer; margin-bottom: 15px; transition: opacity 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px; }
    .btn:active { opacity: 0.8; }
    .btn-primary { background-color: var(--primary-color); color: #fff; }
    .btn-secondary { background-color: var(--card-bg); color: #fff; }

    /* Main Container Structure */
    .header { display: flex; justify-content: space-between; align-items: center; padding: 20px; padding-top: calc(env(safe-area-inset-top) + 20px); font-size: 22px; font-weight: 500; }
    .view-content { flex: 1; overflow-y: auto; padding-bottom: 20px; display: none; width: 100%; max-width: 600px; margin: 0 auto; }
    .view-content.active { display: block; }

    /* Control Tab */
    .status-card { background-color: var(--card-bg); border-radius: 24px; padding: 30px 20px; display: flex; flex-direction: column; align-items: center; text-align: center; margin: 0 20px 20px; }
    .status-icon { width: 80px; height: 80px; background: rgba(139, 126, 248, 0.1); border-radius: 50%; display: flex; justify-content: center; align-items: center; margin-bottom: 20px; }
    .status-icon i { font-size: 30px; color: var(--primary-color); }
    .status-title { font-size: 20px; font-weight: 600; margin-bottom: 10px; }
    .status-desc { font-size: 14px; color: var(--text-muted); margin-bottom: 25px; }

    /* Console Tab */
    .section-title { padding: 0 20px; font-size: 14px; font-weight: 500; color: var(--text-muted); margin-bottom: 15px; margin-top: 10px; }
    .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 0 20px; }
    .command-card { background-color: var(--card-bg); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; align-items: flex-start; cursor: pointer; transition: opacity 0.2s; }
    .command-card:active { opacity: 0.6; }
    .command-icon { width: 44px; height: 44px; background: rgba(139, 126, 248, 0.1); border-radius: 50%; display: flex; justify-content: center; align-items: center; margin-bottom: 16px; }
    .command-icon i { font-size: 18px; color: var(--primary-color); }
    .command-name { font-size: 15px; font-weight: 500; color: #a1a1a6; }
    
    /* Bottom Navigation */
    .bottom-nav { display: flex; justify-content: space-evenly; padding: 15px 10px calc(env(safe-area-inset-bottom) + 15px); background: var(--nav-bg); border-top: 1px solid rgba(255,255,255,0.05); width: 100%; position: absolute; bottom: 0; }
    .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); font-size: 12px; gap: 6px; cursor: pointer; flex: 1; }
    .nav-item.active { color: var(--primary-color); }
    .nav-icon { width: 60px; height: 32px; display: flex; justify-content: center; align-items: center; border-radius: 16px; transition: 0.3s; }
    .nav-item.active .nav-icon { background: rgba(139, 126, 248, 0.2); }
    .nav-item i { font-size: 20px; }

    /* Connect Modal */
    #connect-modal { z-index: 1000; display: none; background-color: var(--bg-color); }
    #connect-modal.active { display: flex; }
    
    /* Исправленная шапка модалки */
    .modal-header { display: grid; grid-template-columns: 50px 1fr 50px; align-items: center; padding: 10px 10px 0; padding-top: calc(env(safe-area-inset-top) + 10px); width: 100%; max-width: 600px; margin: 0 auto; }
    .modal-title { text-align: center; font-size: 20px; font-weight: 500; }
    .icon-btn { display: flex; justify-content: center; align-items: center; width: 44px; height: 44px; font-size: 22px; cursor: pointer; border-radius: 50%; z-index: 1001; }
    .icon-btn:active { background: rgba(255,255,255,0.1); }
    
    .modal-content { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%; max-width: 600px; margin: 0 auto; margin-top: -50px; }
    
    .pulse-container { position: relative; width: 100px; height: 100px; display: flex; justify-content: center; align-items: center; margin-bottom: 30px; }
    .pulse-icon { width: 70px; height: 70px; background: rgba(139, 126, 248, 0.1); border-radius: 50%; display: flex; justify-content: center; align-items: center; position: relative; z-index: 2; border: 1px solid rgba(139, 126, 248, 0.3); }
    .pulse-icon i { font-size: 28px; color: var(--primary-color); }
    .pulse-ring { position: absolute; width: 100%; height: 100%; border-radius: 50%; border: 2px solid var(--primary-color); z-index: 1; animation: pulseAnim 2s infinite cubic-bezier(0.215, 0.61, 0.355, 1); opacity: 0; }
    
    @keyframes pulseAnim {
        0% { transform: scale(0.7); opacity: 0.8; }
        100% { transform: scale(1.6); opacity: 0; }
    }
</style>
</head>
<body>

    <!-- Start Screen -->
    <div id="start-screen" class="screen active">
        <div class="logo-container">
            <i class="fa-solid fa-scooter"></i>
        </div>
        <div class="app-title">LostBot</div>
        <div class="app-version">v1.0.0 (by @yxo42)</div>
        <button class="btn btn-primary" onclick="startApp()">
            <span>&rarr;</span> Start
        </button>
        <button class="btn btn-secondary">
            <i class="fa-solid fa-gear"></i> Settings
        </button>
    </div>

    <!-- Main App Screen -->
    <div id="main-app" class="screen">
        <div class="header">
            <span id="header-title">Control</span>
            <i class="fa-solid fa-gear" style="font-size: 20px;"></i>
        </div>
        
        <!-- View: Control -->
        <div id="view-control" class="view-content active">
            <div class="status-card">
                <div class="status-icon">
                    <i class="fa-solid fa-scooter"></i>
                </div>
                <div class="status-title">No scooter connected</div>
                <div class="status-desc">Scan to find and connect your scooter.</div>
                <button class="btn btn-primary" style="width: 100%; margin: 0;" onclick="openBluetoothScanner()">
                    <i class="fa-brands fa-bluetooth-b"></i> Scan for scooter
                </button>
            </div>
        </div>

        <!-- View: Console -->
        <div id="view-console" class="view-content">
            <div class="section-title">Quick commands</div>
            <div class="grid-container">
                <div class="command-card">
                    <div class="command-icon"><i class="fa-solid fa-lock-open"></i></div>
                    <div class="command-name">Unlock</div>
                </div>
                <div class="command-card">
                    <div class="command-icon"><i class="fa-solid fa-lock"></i></div>
                    <div class="command-name">Lock</div>
                </div>
                <div class="command-card">
                    <div class="command-icon"><i class="fa-solid fa-circle-info"></i></div>
                    <div class="command-name">Device info</div>
                </div>
                <div class="command-card">
                    <div class="command-icon"><i class="fa-solid fa-gauge-simple-high"></i></div>
                    <div class="command-name">Scooter info</div>
                </div>
                <div class="command-card">
                    <div class="command-icon"><i class="fa-solid fa-gauge-high"></i></div>
                    <div class="command-name">Realtime</div>
                </div>
                <div class="command-card">
                    <div class="command-icon"><i class="fa-solid fa-battery-full"></i></div>
                    <div class="command-name">Battery cover</div>
                </div>
                <div class="command-card">
                    <div class="command-icon"><i class="fa-solid fa-lightbulb"></i></div>
                    <div class="command-name">Light on</div>
                </div>
                <div class="command-card">
                    <div class="command-icon"><i class="fa-regular fa-lightbulb"></i></div>
                    <div class="command-name">Light off</div>
                </div>
            </div>
        </div>
        
        <!-- Bottom Navigation -->
        <div class="bottom-nav">
            <div class="nav-item active" id="nav-control" onclick="switchTab('control')">
                <div class="nav-icon"><i class="fa-solid fa-bolt"></i></div>
                <span>Control</span>
            </div>
            <div class="nav-item" id="nav-console" onclick="switchTab('console')">
                <div class="nav-icon"><i class="fa-solid fa-terminal"></i></div>
                <span>Console</span>
            </div>
        </div>
    </div>

    <!-- Connect Modal -->
    <div id="connect-modal" class="screen">
        <div class="modal-header">
            <!-- Кнопка крестика теперь обернута в большой кликабельный блок -->
            <div class="icon-btn" onclick="closeModal()">
                <i class="fa-solid fa-xmark"></i>
            </div>
            <div class="modal-title">Connect</div>
            <div class="icon-btn">
                <i class="fa-solid fa-arrow-rotate-right"></i>
            </div>
        </div>
        <div class="modal-content">
            <div class="pulse-container">
                <div class="pulse-ring"></div>
                <div class="pulse-icon">
                    <i class="fa-brands fa-bluetooth-b"></i>
                </div>
            </div>
            <div class="status-desc" id="bluetooth-status-text">Searching for devices...</div>
        </div>
    </div>

    <script>
        function startApp() {
            document.getElementById('start-screen').classList.remove('active');
            document.getElementById('main-app').classList.add('active');
        }

        function switchTab(tabName) {
            document.querySelectorAll('.view-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            
            document.getElementById('view-' + tabName).classList.add('active');
            document.getElementById('nav-' + tabName).classList.add('active');
            
            const title = tabName.charAt(0).toUpperCase() + tabName.slice(1);
            document.getElementById('header-title').innerText = title;
        }

        async function openBluetoothScanner() {
            // Показываем наше красивое окно поиска
            document.getElementById('connect-modal').classList.add('active');
            const statusText = document.getElementById('bluetooth-status-text');
            statusText.innerText = "Searching for devices...";

            // Проверяем поддержку Web Bluetooth API
            if (!navigator.bluetooth) {
                statusText.innerText = "Bluetooth is not supported in this browser.";
                setTimeout(() => {
                    alert("Ошибка: Web Bluetooth API не поддерживается вашим браузером. Используйте Chrome на ПК/Android.");
                    closeModal();
                }, 500);
                return;
            }

            try {
                // Вызываем системное окно поиска ВСЕХ Bluetooth устройств
                const device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true
                });
                
                // Если пользователь выбрал устройство:
                statusText.innerText = "Connecting to " + (device.name || "Unknown device") + "...";
                console.log("Выбрано устройство:", device);
                
                alert("Успешно выбрано устройство: " + (device.name || "Unknown device"));
                closeModal();

            } catch (error) {
                // Если пользователь нажал "Отмена" или произошла ошибка
                console.log("Bluetooth error:", error);
                
                if (error.name === 'NotFoundError') {
                    // Пользователь закрыл окно выбора без выбора устройства
                    closeModal();
                } else {
                    statusText.innerText = "Error: " + error.message;
                }
            }
        }

        function closeModal() {
            document.getElementById('connect-modal').classList.remove('active');
        }
    </script>
</body>
</html>
